name: Deploy Lambdas to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package and Deploy cmtr_4c27693b_lambda_createOrder
        run: |
          cd lambdas
          zip -r createOrder.zip cmtr_4c27693b_lambda_createOrder/
          aws lambda update-function-code \
            --function-name cmtr_4c27693b_lambda_createOrder \
            --zip-file fileb://createOrder.zip

      - name: Package and Deploy cmtr_4c27693b_lambda_reserveStock
        run: |
          cd lambdas
          zip -r reserveStock.zip cmtr_4c27693b_lambda_reserveStock/
          aws lambda update-function-code \
            --function-name cmtr_4c27693b_lambda_reserveStock \
            --zip-file fileb://reserveStock.zip

      - name: Package and Deploy cmtr_4c27693b_lambda_sendNotification
        run: |
          cd lambdas
          zip -r sendNotification.zip cmtr_4c27693b_lambda_sendNotification/
          aws lambda update-function-code \
            --function-name cmtr_4c27693b_lambda_sendNotification \
            --zip-file fileb://sendNotification.zip
